{% extends 'generic/object_edit.html' %}
{% load static %}

{% block form %}
{{ block.super }}

<!-- Datalist for currency autocomplete -->
<datalist id="currency-datalist">
    {% for currency in existing_currencies %}
    <option value="{{ currency.currency_code }}">{{ currency.currency_code }} ({{ currency.rate_to_nok|floatformat:2 }} NOK)</option>
    {% endfor %}
</datalist>

<style>
.currency-field-wrapper {
    display: flex;
    align-items: flex-start;
    gap: 8px;
}
.currency-code-input {
    flex: 0 0 120px;
}
.currency-sync-btn {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.2s;
}
.currency-sync-btn.active {
    opacity: 1;
    pointer-events: all;
}
.currency-sync-btn.syncing {
    pointer-events: none;
}
</style>

<script>
// Wrap currency field with sync button
document.addEventListener('DOMContentLoaded', function() {
    const currencyInput = document.querySelector('.currency-code-input');
    if (!currencyInput) return;

    // Create wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'currency-field-wrapper';

    // Create sync button
    const syncBtn = document.createElement('button');
    syncBtn.type = 'button';
    syncBtn.className = 'btn btn-sm btn-primary currency-sync-btn';
    syncBtn.innerHTML = '<i class="mdi mdi-sync"></i>';
    syncBtn.title = 'Sync currency from Norges Bank API';

    // Wrap the input
    currencyInput.parentNode.insertBefore(wrapper, currencyInput);
    wrapper.appendChild(currencyInput);
    wrapper.appendChild(syncBtn);

    // Enable/disable sync button based on input length
    function updateSyncButton() {
        const code = currencyInput.value.trim();
        if (code.length === 3) {
            syncBtn.classList.add('active');
        } else {
            syncBtn.classList.remove('active');
        }
    }

    currencyInput.addEventListener('input', updateSyncButton);
    currencyInput.addEventListener('keyup', function(e) {
        if (e.key === 'Enter' && currencyInput.value.trim().length === 3) {
            e.preventDefault();
            syncBtn.click();
        }
    });

    // Sync button click handler
    syncBtn.addEventListener('click', async function() {
        const code = currencyInput.value.trim().toUpperCase();
        if (code.length !== 3) return;

        syncBtn.classList.add('syncing');
        syncBtn.innerHTML = '<i class="mdi mdi-loading mdi-spin"></i>';

        try {
            const response = await fetch('/plugins/licenses/currency-rates/add-api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ currency_code: code })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Success - show checkmark briefly
                syncBtn.innerHTML = '<i class="mdi mdi-check"></i>';
                syncBtn.classList.remove('syncing');
                syncBtn.classList.add('btn-success');

                setTimeout(() => {
                    syncBtn.innerHTML = '<i class="mdi mdi-sync"></i>';
                    syncBtn.classList.remove('btn-success');
                }, 1500);
            } else {
                throw new Error(data.error || 'Failed to sync currency');
            }
        } catch (error) {
            syncBtn.innerHTML = '<i class="mdi mdi-alert"></i>';
            syncBtn.classList.remove('syncing');
            syncBtn.classList.add('btn-danger');
            alert('Failed to sync currency: ' + error.message);

            setTimeout(() => {
                syncBtn.innerHTML = '<i class="mdi mdi-sync"></i>';
                syncBtn.classList.remove('btn-danger');
            }, 2000);
        }
    });

    // Initial state
    updateSyncButton();
});
</script>
{% endblock %}

{% block javascript %}
{{ block.super }}
<script>
(function() {
    'use strict';

    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
        // FEATURE 1: Dynamic pricing mode label
        const pricingModeField = document.querySelector('#id_pricing_mode') ||
                                document.querySelector('select[name="pricing_mode"]');
        const priceField = document.querySelector('#id_price') ||
                          document.querySelector('input[name="price"]');

        if (pricingModeField && priceField) {
            // Find the label for the price field
            const priceLabel = document.querySelector('label[for="id_price"]');

            function updatePriceLabel() {
                const mode = pricingModeField.value;
                if (priceLabel) {
                    if (mode === 'per_seat') {
                        priceLabel.textContent = 'Price Per Seat';
                    } else if (mode === 'total') {
                        priceLabel.textContent = 'Total License Price';
                    } else {
                        priceLabel.textContent = 'Price';
                    }
                }
            }

            // Update label on change
            pricingModeField.addEventListener('change', updatePriceLabel);

            // Update label on page load
            updatePriceLabel();
        }

        // FEATURE 2: Auto-fill from license
        // Get the license select field - try multiple selectors
        const licenseField = document.querySelector('#id_license') ||
                           document.querySelector('select[name="license"]');

        if (!licenseField) {
            return;
        }

        // Function to auto-fill fields based on license ID
        function autoFillFromLicense(licenseId) {
            if (!licenseId) return;

            // Fetch license details via API
            const apiUrl = `/api/plugins/licenses/licenses/${licenseId}/`;

            fetch(apiUrl, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                // Auto-fill seats purchased first (needed for price calculation)
                const seatsField = document.querySelector('#id_seats_purchased') ||
                                 document.querySelector('input[name="seats_purchased"]');
                if (seatsField && data.total_licenses) {
                    seatsField.value = data.total_licenses;
                }

                // Calculate and auto-fill total price (seats × unit price)
                const priceField = document.querySelector('#id_price') ||
                                 document.querySelector('input[name="price"]');
                if (priceField && data.price && data.total_licenses) {
                    const unitPrice = parseFloat(data.price);
                    const totalSeats = parseInt(data.total_licenses);
                    const totalPrice = (unitPrice * totalSeats).toFixed(2);
                    priceField.value = totalPrice;
                }

                // Auto-fill currency
                const currencyField = document.querySelector('#id_currency') ||
                                    document.querySelector('select[name="currency"]');
                if (currencyField && data.currency) {
                    // Check if Tom-Select is being used (NetBox's custom select widget)
                    if (currencyField.tomselect) {
                        currencyField.tomselect.setValue(data.currency, false);
                    } else {
                        currencyField.value = data.currency;
                    }
                }

                // Auto-fill payment method
                const paymentMethodField = document.querySelector('#id_payment_method') ||
                                         document.querySelector('select[name="payment_method"]');
                if (paymentMethodField && data.payment_method) {
                    // Check if Tom-Select is being used
                    if (paymentMethodField.tomselect) {
                        paymentMethodField.tomselect.setValue(data.payment_method, false);
                    } else {
                        paymentMethodField.value = data.payment_method;
                    }
                }
            })
            .catch(error => {
                // Silently fail - field will remain at default values
            });
        }

        // Auto-fill when license is changed
        licenseField.addEventListener('change', function() {
            autoFillFromLicense(this.value);
        });

        // Also auto-fill on page load if license is already selected
        // (e.g., when coming from license detail page with ?license=ID)
        if (licenseField.value) {
            autoFillFromLicense(licenseField.value);
        }
    });
})();
</script>
{% endblock %}
